apply plugin: 'com.android.application'

/**
 * 签名与版本号
 * - 签名：固定 keystore，否则新包无法覆盖安装旧包（会报签名冲突）
 * - 版本：CI 通过环境变量注入 tag 版本；本地构建回落到默认值
 * - 密钥来源：CI 用环境变量（从 Actions Secrets 还原），本地用 ddl-release.properties
 *   （properties 与 keystore 已被 .gitignore 排除，不会进公开仓库）
 */
def keystorePropertiesFile = rootProject.file('ddl-release.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envKeystorePath = System.getenv('DDL_KEYSTORE_PATH')
def hasEnvSigning = envKeystorePath != null && !envKeystorePath.trim().isEmpty() && new File(envKeystorePath).exists()

def appVersionName = System.getenv('DDL_VERSION_NAME') ?: '0.1.0'

// versionCode 由语义化版本推导，CI 与本地构建结果一致且单调递增：
//   100000000 + major*10000 + minor*100 + patch
// 1) 上限 2100000000，major 可用到 20 万，够用；
// 2) 早期版本用的是「分钟级时间戳」(≈2.99e7)，1e8 起步能直接覆盖安装，不会判成降级；
// 3) 同一版本重复构建得到相同 code（可以重装），要重新发布时请提 patch 号。
def versionMatcher = (appVersionName =~ /^v?(\d+)\.(\d+)\.(\d+)/)
def appVersionCode = 100000000
if (versionMatcher.find()) {
    def vMajor = versionMatcher.group(1) as int
    def vMinor = versionMatcher.group(2) as int
    def vPatch = versionMatcher.group(3) as int
    appVersionCode = 100000000 + vMajor * 10000 + vMinor * 100 + vPatch
}

android {
    namespace "com.ddl.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ddl.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasEnvSigning || keystorePropertiesFile.exists()) {
            release {
                if (hasEnvSigning) {
                    storeFile new File(envKeystorePath)
                    storePassword System.getenv('DDL_KEYSTORE_PASSWORD')
                    keyAlias System.getenv('DDL_KEY_ALIAS') ?: 'ddl'
                    keyPassword System.getenv('DDL_KEY_PASSWORD')
                } else {
                    storeFile rootProject.file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            }
        }
    }
    buildTypes {
        debug {
            // 本地 debug 包也用正式签名，这样它能直接覆盖手机上已装的版本
            if (hasEnvSigning || keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasEnvSigning || keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
